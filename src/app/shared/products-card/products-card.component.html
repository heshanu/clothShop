<mat-card class="example-card" appearance="outlined">
    <mat-card-header>
      <div mat-card-avatar class="example-header-image"></div>
      <mat-card-title>{{products.title}}</mat-card-title>
    </mat-card-header>
    <img mat-card-image [src]="products.image" alt="Photo of a Shiba Inu">
    <mat-card-content>
      <p>
        {{products.options|json}}
      </p>
    </mat-card-content>
    <mat-card-actions>
      <button mat-button>LIKE</button>
      <button mat-button>SHARE</button>
    </mat-card-actions>
    <mat-horizontal-stepper/>
  </mat-card>
