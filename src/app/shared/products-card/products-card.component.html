<mat-card class="example-card" appearance="outlined">
    <mat-card-header>
      <mat-card-title>{{products.brand}}</mat-card-title>
      :{{products.color|uppercase}}
    </mat-card-header>
    <img mat-card-image [src]="products.image">
    <mat-card-content>
      <p>
        {{products.title}}
      </p>
    </mat-card-content>
    <mat-card-actions>
      <button mat-button>{{products?.price|currency}}</button>
      <button mat-button>{{products.quantity}} Avaliable</button>
    </mat-card-actions>
    <mat-horizontal-stepper/>
  </mat-card>
